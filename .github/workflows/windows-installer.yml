name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - deploy
    paths:
      - backend/**
      - frontend/**
      - scripts/windows/**
      - tools/windows-installer/**
      - .github/workflows/windows-installer.yml

permissions:
  contents: write

jobs:
  build:
    name: Build VisAIble_Setup.exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" tools\windows-installer\VisAIble.iss'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisAIble_Setup
          path: tools/windows-installer/output/VisAIble_Setup.exe

      - name: Publish latest release
        if: github.ref == 'refs/heads/deploy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-installer-latest"
          $asset = "tools/windows-installer/output/VisAIble_Setup.exe"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag" --force
          if (gh release view $tag *> $null) {
            gh release upload $tag $asset --clobber
          } else {
            gh release create $tag $asset --title "VisAIble Windows Installer" --notes "Latest Windows installer for VisAIble."
          }
